# CareerAI — конфигурация сайта nginx.
# Копируется в /etc/nginx/conf.d/careerai.conf (внутри http{} — limit_req_zone валиден).
#
# Локальная разработка: HTTP-прокси на app:7777.
# Продакшен с HTTPS: выпустите сертификаты через ./nginx/init-letsencrypt.sh
# и добавьте server-блок 443 (см. комментарий в конце файла).

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 210m;

    # HTTP-заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Для выпуска сертификатов Let's Encrypt (webroot-верификация)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Rate-limit для входа в админку
    location /auth/login {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://app:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://app:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

